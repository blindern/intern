services:
  database:
    image: postgres:19@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
    volumes:
      - db:/var/lib/postgresql
    environment:
      POSTGRES_DB: intern
      POSTGRES_USER: intern
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  db:
